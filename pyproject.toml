[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dotlet"
version = "0.1.0"
description = "Statistical tests for whether an AI model was trained on your material (text or images)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mia = ["torch", "transformers"]
images = ["Pillow", "numpy"]
image-clip = ["Pillow", "numpy", "torch", "transformers"]
image-mia = ["Pillow", "numpy", "torch", "transformers", "diffusers"]
dev = ["pytest", "Pillow", "numpy"]

[project.scripts]
dotlet = "dotlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
